<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Find kids books at your local library or on sale">
<meta name="theme-color" content="#4a90e2"> 
    <title>📊 Book Availability</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body {
            font-family: Arial;
            background: #f5f5f7;
            margin: 0;
            text-align: center;
        }

        /* ✅ NAV */
        .nav {
            display: flex;
            gap: 20px;
            padding: 15px;
            background: white;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
            justify-content: center;
        }

        .nav a {
            text-decoration: none;
            color: #333;
            font-weight: bold;
            padding: 6px 10px;
            border-radius: 8px;
            transition: 0.2s;
        }

        .nav a:hover {
            background: #f0f0f0;
        }

        h1 {
            padding: 20px;
        }

        .controls {
            margin: 20px;
        }

        input {
            padding: 10px;
            width: 250px;
            border-radius: 8px;
            border: 1px solid #ddd;
        }

        button {
            padding: 10px 15px;
            border-radius: 8px;
            border: none;
            background: #4a90e2;
            color: white;
            cursor: pointer;
        }

        /* ✅ BIG CHART */
        .chart-wrapper {
            width: 95%;
            max-width: 1400px;
            height: 600px;
            margin: 40px auto;
        }

        .chart-wrapper canvas {
            width: 100% !important;
            height: 100% !important;
        }
    </style>
</head>

<body>

<div class="nav">
    <a href="/">📚 Books</a>
    <a href="/bookdeals">🔥 Deals</a>
    <a href="/trending">📈 Trending Books</a>
    <a href="/availability-page">📊 Charts</a>
</div>

<h1>📊 Library Availability Trend</h1>

<div class="controls">
    <input id="book_id" placeholder="Enter book id..." />
    <button onclick="loadChart()">Show Graph</button>
</div>

<!-- ✅ BIG CHART CONTAINER -->
<div class="chart-wrapper">
    <canvas id="chart"></canvas>
</div>

<script>
let chart;

function loadChart() {
    const book_id = document.getElementById("book_id").value;

    fetch(`/availability-history/${book_id}`)
        .then(res => res.json())
        .then(data => {

            const filtered = data.filter(d => d.total > 0);

            if (filtered.length === 0) {
                alert("No valid data found");
                return;
            }

            // ✅ FIXED timestamp
            const labels = filtered.map(d =>
                new Date(d.timestamp).toLocaleString()
            );

            const available = filtered.map(d => d.available);
            const total = filtered.map(d => d.total);

            if (chart) {
                chart.destroy();
            }

            chart = new Chart(document.getElementById("chart"), {
                type: "line",
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: "Available Copies",
                            data: available,
                            borderWidth: 2,
                            tension: 0.3
                        },
                        {
                            label: "Total Copies",
                            data: total,
                            borderWidth: 2,
                            tension: 0.3
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,  // 🔥 allows big height
                    interaction: {
                        mode: "index",
                        intersect: false
                    },
                    scales: {
                        y: {
                            beginAtZero: true
                        }
                    }
                }
            });
        });
}

// auto load from URL
const params = new URLSearchParams(window.location.search);
const book_id = params.get("book_id");

if (book_id) {
    document.getElementById("book_id").value = book_id;
    loadChart();
}
</script>

</body>
</html>
